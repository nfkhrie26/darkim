<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Neo-Brutalist White Card with Black Shadow and Border -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="#000000"/>
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#FFFFFF" stroke="#000000" stroke-width="7"/>
  
  <!-- "IM" in Brand Emerald Green (#00D084) -->
  <text x="60" y="76" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="58" text-anchor="middle" fill="#00D084" letter-spacing="-1">IM</text>
  
  <!-- Green Underline Bar with Rounded Ends -->
  <rect x="36" y="86" width="48" height="8" rx="4" fill="#00D084"/>
</svg>
