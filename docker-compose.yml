services:
  postgres:
    image: postgres:17-alpine
    container_name: darkim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: darkim
    ports:
      - "5432:5432"
    volumes:
      - darkim_pgdata:/var/lib/postgresql/data

volumes:
  darkim_pgdata:

